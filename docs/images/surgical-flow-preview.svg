<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SurgicalFlow temporal modelling showcase</title>
  <desc id="desc">A polished README preview for a surgical workflow prediction pipeline with task cards, model comparison, and visible artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.48" stop-color="#164e63"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.20"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="56" y="50" width="1088" height="575" rx="26" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="56" y="50" width="1088" height="118" rx="26" fill="#0f172a"/>
  <rect x="56" y="132" width="1088" height="36" fill="#0f172a"/>

  <text x="96" y="103" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">SurgicalFlow</text>
  <text x="96" y="140" fill="#bae6fd" font-family="Arial, sans-serif" font-size="18">Temporal surgical phase prediction with CNN and CNN-LSTM pipelines</text>
  <rect x="920" y="82" width="170" height="42" rx="21" fill="#14b8a6"/>
  <text x="951" y="109" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700">PyTorch Pipeline</text>

  <g font-family="Arial, sans-serif">
    <rect x="96" y="210" width="228" height="118" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <text x="122" y="250" fill="#64748b" font-size="15">Task A</text>
    <text x="122" y="286" fill="#0f172a" font-size="25" font-weight="700">Phase + Time</text>
    <text x="122" y="312" fill="#475569" font-size="14">classification and remaining-time regression</text>

    <rect x="352" y="210" width="228" height="118" rx="18" fill="#ffffff" stroke="#dcfce7"/>
    <text x="378" y="250" fill="#64748b" font-size="15">Task B</text>
    <text x="378" y="286" fill="#0f172a" font-size="25" font-weight="700">Timeline Head</text>
    <text x="378" y="312" fill="#475569" font-size="14">future phase boundary estimation</text>

    <rect x="608" y="210" width="228" height="118" rx="18" fill="#ffffff" stroke="#fef3c7"/>
    <text x="634" y="250" fill="#64748b" font-size="15">Task C</text>
    <text x="634" y="286" fill="#0f172a" font-size="25" font-weight="700">Tool Presence</text>
    <text x="634" y="312" fill="#475569" font-size="14">multi-label instrument recognition</text>

    <rect x="864" y="210" width="228" height="118" rx="18" fill="#ffffff" stroke="#fce7f3"/>
    <text x="890" y="250" fill="#64748b" font-size="15">Verification</text>
    <text x="890" y="286" fill="#0f172a" font-size="25" font-weight="700">Data-free CI</text>
    <text x="890" y="312" fill="#475569" font-size="14">structure checks and README assets</text>
  </g>

  <g transform="translate(96 382)">
    <rect width="448" height="168" rx="18" fill="#0b1220"/>
    <circle cx="28" cy="30" r="7" fill="#fb7185"/>
    <circle cx="52" cy="30" r="7" fill="#fbbf24"/>
    <circle cx="76" cy="30" r="7" fill="#34d399"/>
    <text x="28" y="72" fill="#93c5fd" font-family="Menlo, Consolas, monospace" font-size="15">train_backbone.py --model cnn_lstm</text>
    <text x="28" y="104" fill="#a7f3d0" font-family="Menlo, Consolas, monospace" font-size="15">outputs: config, log, curve, checkpoint</text>
    <text x="28" y="136" fill="#fde68a" font-family="Menlo, Consolas, monospace" font-size="15">metrics: phase acc, MAE, R2, tool F1</text>
  </g>

  <g transform="translate(604 374)">
    <rect width="488" height="184" rx="18" fill="#ffffff" stroke="#dbeafe"/>
    <text x="30" y="42" fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">Visible README Artifacts</text>
    <line x1="30" y1="66" x2="458" y2="66" stroke="#e2e8f0"/>
    <text x="30" y="102" fill="#475569" font-family="Arial, sans-serif" font-size="15">01  Training pipeline diagram</text>
    <rect x="342" y="84" width="84" height="28" rx="14" fill="#dbeafe"/>
    <text x="362" y="103" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="13" font-weight="700">PNG</text>
    <text x="30" y="140" fill="#475569" font-family="Arial, sans-serif" font-size="15">02  Remaining-time comparison figure</text>
    <rect x="342" y="122" width="84" height="28" rx="14" fill="#dcfce7"/>
    <text x="362" y="141" fill="#15803d" font-family="Arial, sans-serif" font-size="13" font-weight="700">JPG</text>
    <text x="30" y="174" fill="#64748b" font-family="Arial, sans-serif" font-size="13">Full training requires local Cholec80 data; showcase checks run without it.</text>
  </g>
</svg>
